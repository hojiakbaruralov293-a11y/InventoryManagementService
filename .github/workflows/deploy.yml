name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore InventoryManagementService.sln

      - name: Build
        run: dotnet build InventoryManagementService.sln --no-restore --configuration Release

  # ─────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH → GHCR
  # ─────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: GHCR ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Docker image build va push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────
  # 3. EC2 GA DEPLOY
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: EC2 ga deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,GH_REPO
          script: |
            set -e

            # GHCR ga login
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Yangi imageni tortish
            IMAGE="ghcr.io/${GH_REPO,,}:latest"
            docker pull "$IMAGE"

            # Eski containerni to'xtatish
            docker stop inventory-app 2>/dev/null || true
            docker rm   inventory-app 2>/dev/null || true

            # Yangi containerni port 8080 da ishga tushirish (nginx proxy qiladi)
            docker run -d \
              --name inventory-app \
              --restart unless-stopped \
              -p 8080:8080 \
              $([ -f /home/ubuntu/.env ] && echo "--env-file /home/ubuntu/.env" || echo "") \
              "$IMAGE"

            # Container ishga tushganini tekshirish
            sleep 5
            if ! docker ps --filter "name=inventory-app" --filter "status=running" | grep -q inventory-app; then
              echo "❌ Container ishga tushmadi! Loglar:"
              docker logs inventory-app --tail 50
              exit 1
            fi
            echo "✅ Container ishlamoqda"

            # Nginx o'rnatish (agar yo'q bo'lsa)
            if ! command -v nginx &>/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq nginx
            fi

            # Nginx konfiguratsiyasi — port 80 → 8080
            sudo tee /etc/nginx/sites-available/nexuscrm > /dev/null <<'NGINX'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass         http://localhost:8080;
                    proxy_http_version 1.1;
                    proxy_set_header   Upgrade $http_upgrade;
                    proxy_set_header   Connection keep-alive;
                    proxy_set_header   Host $host;
                    proxy_set_header   X-Real-IP $remote_addr;
                    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINX

            # Default konfiguratsiyani o'chirib, nexuscrm ni yoqish
            sudo ln -sf /etc/nginx/sites-available/nexuscrm /etc/nginx/sites-enabled/nexuscrm
            sudo rm -f /etc/nginx/sites-enabled/default

            # Nginx konfiguratsiyasini tekshirish va qayta yuklash
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            # GHCR dan chiqish
            docker logout ghcr.io

            # Eski imagelarni tozalash
            docker image prune -f

            echo "✅ Deploy muvaffaqiyatli! Image: $IMAGE"

      - name: Deploy natijasi
        if: failure()
        run: echo "❌ Deploy xato! GitHub Actions → Logs ni tekshiring."
