name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore InventoryManagementService.sln

      - name: Build
        run: dotnet build InventoryManagementService.sln --no-restore --configuration Release

  # ─────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH → GHCR
  # ─────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: GHCR ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Docker image build va push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────
  # 3. EC2 GA DEPLOY
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: EC2 ga deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,GH_REPO
          script: |
            set -e

            # GHCR ga login (workflow token bilan — har deploy yangilanadi)
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Yangi imageni tortish
            IMAGE="ghcr.io/${GH_REPO,,}:latest"
            docker pull "$IMAGE"

            # Eski containerni to'xtatish
            docker stop inventory-app 2>/dev/null || true
            docker rm   inventory-app 2>/dev/null || true

            # Yangi containerni ishga tushirish
            docker run -d \
              --name inventory-app \
              --restart unless-stopped \
              -p 80:8080 \
              $([ -f /home/ubuntu/.env ] && echo "--env-file /home/ubuntu/.env" || echo "") \
              "$IMAGE"

            # GHCR dan chiqish
            docker logout ghcr.io

            # Eski imagelarni tozalash
            docker image prune -f

            echo "✅ Deploy muvaffaqiyatli! Image: $IMAGE"

      - name: Deploy natijasi
        if: failure()
        run: echo "❌ Deploy xato! GitHub Actions → Logs ni tekshiring."
